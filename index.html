    <style>
        :root { --bg: #0d1117; --text: #c9d1d9; --accent: #58a6ff; --card-bg: #161b22; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .card { text-align: center; padding: 2.5rem; border: 1px solid #30363d; border-radius: 12px; background: var(--card-bg); box-shadow: 0 8px 24px rgba(0,0,0,0.5); max-width: 350px; width: 90%; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .logo { width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--accent); padding: 4px; margin-bottom: 15px; object-fit: cover; }
        h1 { font-size: 1.5rem; margin: 10px 0; color: white; }
        p { font-size: 0.95rem; margin-bottom: 25px; color: #8b949e; }

        /* Projeleri alt alta düzgün dizmek için kapsayıcı */
        .projects-list {
            display: flex;
            flex-direction: column;
            gap: 12px; /* Projeler arası dikey boşluk */
            width: 100%;
        }

        .button-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 6px;
            background: var(--accent);
            color: white;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: bold;
            transition: background 0.2s;
            flex-grow: 1; /* Ana butonların eşit genişlikte uzamasını sağlar */
        }
        .btn:hover { background: #3c8ce7; }

        .btn-icon {
            padding: 10px;
            gap: 0;
            flex-grow: 0; /* İkon butonunun genişlemesini engeller */
        }

        .error { color: #ff7b72 !important; }
        .error-bar { background: #ff7b72 !important; }
    </style>
</head>

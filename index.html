<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umut | Projelerim</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0d1117;
            --text: #c9d1d9;
            --accent: #58a6ff;
            --card-bg: #161b22;
            --border-color: #30363d;
        }

        body {
            background-color: var(--bg);
            /* Arka plana modern bir derinlik katar */
            background-image: radial-gradient(circle at top left, rgba(88, 166, 255, 0.08) 0%, transparent 40%),
                              radial-gradient(circle at bottom right, rgba(88, 166, 255, 0.05) 0%, transparent 40%);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .card {
            text-align: center;
            padding: 2.5rem;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            background: var(--card-bg);
            box-shadow: 0 12px 32px rgba(0,0,0,0.6);
            max-width: 380px;
            width: 90%;
            position: relative;
            animation: fadeUpCard 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Kartın üstündeki mavi parlak çizgi */
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            background: linear-gradient(90deg, var(--accent), #bc8cff);
        }

        /* Profil Fotoğrafı ve Pulse Efekti */
        .logo-container {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 15px auto;
        }
        .logo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid var(--card-bg);
            object-fit: cover;
            position: relative;
            z-index: 2;
            background-color: #21262d;
        }
        .logo-container::after {
            content: '';
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--accent), #bc8cff);
            z-index: 1;
            animation: pulseGlow 2s infinite alternate;
        }

        h1 {
            font-size: 1.6rem;
            margin: 10px 0 5px 0;
            color: #ffffff;
            font-weight: 800;
        }

        .username {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            margin-bottom: 15px;
            color: var(--accent);
        }

        /* Teknolojiler / Badges */
        .badges {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .badge {
            background-color: #21262d;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Projeler Listesi */
        .projects-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .button-group {
            display: flex;
            align-items: stretch;
            justify-content: center;
            gap: 8px;
            width: 100%;
            opacity: 0; /* Animasyon için başlangıçta görünmez */
            transform: translateY(10px);
            animation: fadeUpItem 0.5s forwards;
        }

        /* Staggered (Sıralı) Animasyon Gecikmeleri */
        .button-group:nth-child(1) { animation-delay: 0.2s; }
        .button-group:nth-child(2) { animation-delay: 0.3s; }
        .button-group:nth-child(3) { animation-delay: 0.4s; }
        .button-group:nth-child(4) { animation-delay: 0.5s; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 20px;
            border-radius: 8px;
            background: #21262d;
            border: 1px solid var(--border-color);
            color: var(--text);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.2s ease;
            flex-grow: 1;
        }

        .btn:hover {
            background: #30363d;
            border-color: var(--accent);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(88, 166, 255, 0.1);
        }

        .btn svg {
            color: var(--accent);
            transition: color 0.2s ease;
        }

        .btn-icon {
            padding: 12px;
            gap: 0;
            flex-grow: 0;
            background: var(--bg);
        }
        .btn-icon:hover svg {
            color: #ffffff;
        }

        /* Keyframes */
        @keyframes fadeUpCard {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeUpItem {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulseGlow {
            from { opacity: 0.6; filter: blur(4px); }
            to { opacity: 1; filter: blur(6px); }
        }
    </style>
</head>
